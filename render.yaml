services:
  - type: web
    name: personal-finance-manager
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: finance-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: finance-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: finance-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: finance-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finance-postgres
          property: password

databases:
  - name: finance-postgres
    databaseName: finance_db
    plan: free
